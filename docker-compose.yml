services:
  workoutassistant:
    # Use the image from DockerHub (will be built by GitHub Actions)
    image: ${DOCKER_IMAGE:-beefybeefy/workoutassistant:latest}
    container_name: workoutassistant
    restart: unless-stopped

    env_file:
      - ${HOME}/.variables
    
    volumes:
      # Mount data directory for persistence
      - ./data:/app/data
      
      # Mount models directory from user's home directory
      - ${HOME}/models:/app/models
      
      # Mount generated images directory for AI-generated images
      - ./generated_images:/app/src/generated_images
      
      # Mount logs directory
      - ./logs:/app/logs
      
      # Mount secrets directory for .variables file
      - ${HOME}/.variables:/app/.secrets/.variables:ro
    
    environment:
      # Environment variables that are safe to include
      - PYTHONPATH=/app/src
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - LOG_LEVEL=INFO
      # Fix permissions by running as current user
    user: "1000:1000"
      
    # Resource limits (adjust based on your Raspberry Pi specs)
    deploy:
      resources:
        limits:
          memory: 5.5G  # Leave ~2.5GB for host OS and Docker overhead
          cpus: '3.5'   # Leave some CPU headroom for system processes
        reservations:
          memory: 1G
          cpus: '0.5'
    
    # Health check
    healthcheck:
      test: ["CMD", "python", "-c", "import psutil; import os; exit(0 if any('main.py' in cmd for cmd in [' '.join(p.cmdline()) for p in psutil.process_iter()]) else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 2m
    
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# Optional: Add a watchtower container for automatic updates
  watchtower:
    image: containrrr/watchtower:latest
    container_name: watchtower
    restart: unless-stopped
    env_file:
      - ${HOME}/.variables-watchtower  # Variables will be read from this file into the container
    environment:
      - WATCHTOWER_POLL_INTERVAL=300  # Check for updates every 5 minutes
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_INCLUDE_RESTARTING=true
      # Email notifications will use variables from env_file:
      - WATCHTOWER_NOTIFICATIONS=shoutrrr://smtp://workoutassistant:$$GMAIL_APP_PASSWORD@smtp.gmail.com:587/?from=$$GMAIL_ADDRESS&to=$$ADMIN_EMAIL&subject=Watchtower%20Update
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: workoutassistant

volumes:
  workout_data:
    driver: local
  workout_models:
    driver: local
  workout_logs:
    driver: local
  workout_generated_images:
    driver: local