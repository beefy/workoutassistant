services:
  workoutassistant:
    # Use the image from DockerHub (will be built by GitHub Actions)
    image: ${DOCKER_IMAGE:-beefybeefy/workoutassistant:latest}
    # image: workoutassistant-local  # Changed from remote image
    platform: linux/arm64  # Force ARM64 architecture for Raspberry Pi
    container_name: workoutassistant
    restart: unless-stopped
    network_mode: "host"  # Use host network instead of bridge for cluster connectivity
    
    # Add extra hosts as fallback if mDNS fails
    extra_hosts:
      - "host.docker.internal:host-gateway"

    env_file:
      - ${HOME}/.variables
    
    volumes:
      # Mount data directory for persistence
      - ./data:/app/data
      
      # Mount models directory from user's home directory
      - ${HOME}/models:/app/models
      
      # Mount generated images directory for AI-generated images
      - ./generated_images:/app/src/generated_images
      
      # Mount logs directory
      - ./logs:/app/logs
      
      # Mount secrets directory for .variables file
      - ${HOME}/.variables:/app/.secrets/.variables:ro
      
      # Mount DNS resolution files for .local hostname support
      - /etc/resolv.conf:/etc/resolv.conf:ro
      - /etc/hosts:/etc/hosts:ro
    
    environment:
      # Environment variables that are safe to include
      - PYTHONPATH=/app/src
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - LOG_LEVEL=INFO
      # Fix for .local hostname resolution in containers
      - LOCALDOMAIN=local
      - SEARCH=local
      # User is handled by Dockerfile, no need to override
      
    # Resource limits (adjust based on your Raspberry Pi specs)  
    deploy:
      resources:
        limits:
          memory: 6G
          cpus: '3.5'
        reservations:
          memory: 2G
          cpus: '0.5'

    # Health check is already configured in the Dockerfile
    
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  workout_data:
    driver: local
  workout_models:
    driver: local
  workout_logs:
    driver: local
  workout_generated_images:
    driver: local