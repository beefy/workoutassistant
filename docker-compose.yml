services:
  workoutassistant:
    # Use the image from DockerHub (will be built by GitHub Actions)
    image: ${DOCKER_IMAGE:-beefybeefy/workoutassistant:latest}
    # image: workoutassistant-local  # Changed from remote image
    platform: linux/arm64  # Force ARM64 architecture for Raspberry Pi
    container_name: workoutassistant
    restart: unless-stopped

    env_file:
      - ${HOME}/.variables
    
    volumes:
      # Mount data directory for persistence
      - ./data:/app/data
      
      # Mount models directory from user's home directory
      - ${HOME}/models:/app/models
      
      # Mount generated images directory for AI-generated images
      - ./generated_images:/app/src/generated_images
      
      # Mount logs directory
      - ./logs:/app/logs
      
      # Mount secrets directory for .variables file
      - ${HOME}/.variables:/app/.secrets/.variables:ro
    
    environment:
      # Environment variables that are safe to include
      - PYTHONPATH=/app/src
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - LOG_LEVEL=INFO
      # User is handled by Dockerfile, no need to override
      
    # Resource limits (adjust based on your Raspberry Pi specs)  
    deploy:
      resources:
        limits:
          memory: 6G
          cpus: '3.5'
        reservations:
          memory: 2G
          cpus: '0.5'

    # Health check is already configured in the Dockerfile
    
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Optional: Add a watchtower container for automatic updates (disabled due to restart loop)
  watchtower:
    image: containrrr/watchtower:latest
    container_name: watchtower
    restart: unless-stopped
    env_file:
      - ${HOME}/.variables-watchtower
    environment:
      - WATCHTOWER_POLL_INTERVAL=300
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_INCLUDE_RESTARTING=true

      # Enable email notifications
      - WATCHTOWER_NOTIFICATIONS=email

      # SMTP settings
      - WATCHTOWER_NOTIFICATION_EMAIL_FROM=${GMAIL_ADDRESS}
      - WATCHTOWER_NOTIFICATION_EMAIL_TO=${ADMIN_EMAIL}
      - WATCHTOWER_NOTIFICATION_EMAIL_SERVER=smtp.gmail.com
      - WATCHTOWER_NOTIFICATION_EMAIL_SERVER_PORT=587
      - WATCHTOWER_NOTIFICATION_EMAIL_SERVER_USER=${GMAIL_ADDRESS}
      - WATCHTOWER_NOTIFICATION_EMAIL_SERVER_PASSWORD=${GMAIL_APP_PASSWORD}
      - WATCHTOWER_NOTIFICATION_EMAIL_DELAY=2
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: workoutassistant

volumes:
  workout_data:
    driver: local
  workout_models:
    driver: local
  workout_logs:
    driver: local
  workout_generated_images:
    driver: local