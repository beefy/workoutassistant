name: Build and Push Docker Image

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # Allow manual triggers

env:
  DOCKER_BUILDKIT: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  security-events: write  # Required for uploading SARIF results
  packages: write

jobs:
  build-and-push:
    runs-on: self-hosted
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
      
    - name: Log in to DockerHub
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
        
    - name: Verify DockerHub login
      if: github.event_name != 'pull_request'
      run: |
        # Verify the token is valid and check rate limit status
        docker info 2>&1 | head -20
        echo "---"
        # Check if we can access DockerHub registry
        curl -s -o /dev/null -w "DockerHub HTTP Status: %{http_code}\n" \
          "https://registry-1.docker.io/v2/" || echo "DockerHub registry check failed"
        echo "DockerHub username: ${{ secrets.DOCKERHUB_USERNAME }}"
        
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ${{ secrets.DOCKERHUB_USERNAME }}/workoutassistant
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}
        flavor: |
          latest=auto
          
    - name: Build and push Docker image
      uses: docker/build-push-action@v7
      with:
        context: .
        platforms: linux/arm64  # ARM64 only for Raspberry Pi deployment
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        # Use GHA cache only (not registry cache) to avoid DockerHub blob upload issues
        # The 400 Bad Request on PUT to registry-1.docker.io is caused by:
        # 1. Upload URL expiry during long builds (30-min timeout)
        # 2. DockerHub rate limiting on free plans
        # 3. Large layer sizes from Python/Rust compilation
        # Using GHA cache avoids pushing cache layers to DockerHub entirely
        cache-from: type=gha
        cache-to: type=gha,mode=max
        # Disable provenance attestations and SBOM to reduce pushed data
        provenance: false
        sbom: false
        
    - name: Pull image for scanning
      if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
      run: docker pull ${{ secrets.DOCKERHUB_USERNAME }}/workoutassistant:latest
        
    - name: Image scan with Trivy
      if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
      uses: aquasecurity/trivy-action@0.29.0
      with:
        image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/workoutassistant:latest
        format: 'sarif'
        output: 'trivy-results.sarif'
        severity: 'CRITICAL,HIGH'
        exit-code: '0'  # Don't fail the build on security issues
        
    - name: Upload Trivy scan results to GitHub Security tab
      if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: 'trivy-results.sarif'
